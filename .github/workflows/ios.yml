name: iOS

on:
  pull_request:
    paths:
      - 'iOS/**'
      - 'Packages/BloomClient/**'
      - 'Packages/BloomUI/**'
      - 'Packages/BloomAuthentication/**'
      - 'Packages/BloomSSH/**'
      - 'Sources/BloomCore/Presentation/PaletteInk.swift'
      - 'Resources/Bloom.icon/**'
      - 'Tools/*ios*'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bloom-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Test portable client and SSH transport
        run: |
          swift test --package-path Packages/BloomClient -j 2
          swift test --package-path Packages/BloomSSH -j 2
      - name: Build iPhone and iPad Simulator application
        run: Tools/build-ios.sh
      - name: Verify unsigned device archive
        run: Tools/archive-ios.sh
