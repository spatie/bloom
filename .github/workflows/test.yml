name: PR 178 test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5fe9078728f05c37bc532c25ddc4bfaf3faff279
          persist-credentials: false
      - name: Build isolated Bloom Dev
        shell: bash
        run: |
          set -euo pipefail
          ./Tools/dev-build.sh HEAD --no-install | tee "$RUNNER_TEMP/bloom-dev.log"
      - name: Package a portable download
        shell: bash
        run: |
          set -euo pipefail
          built="$(sed -n 's/^==> built //p' "$RUNNER_TEMP/bloom-dev.log" | tail -1)"
          test -d "$built"
          mkdir -p dist
          ditto "$built" "dist/Bloom Dev.app"
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path('dist/Bloom Dev.app/Contents/Info.plist')
          with path.open('rb') as handle:
              info = plistlib.load(handle)
          assert info['CFBundleIdentifier'] == 'be.spatie.bloom.dev'
          assert info['BloomMasterCommit'].startswith('5fe9078')
          # Use Store's bundle-id fallback on the recipient's Mac, not the CI home directory.
          info.pop('LSEnvironment', None)
          info['BloomPRCommit'] = '5fe9078728f05c37bc532c25ddc4bfaf3faff279'
          with path.open('wb') as handle:
              plistlib.dump(info, handle)
          PY
          codesign --force --deep --sign - "dist/Bloom Dev.app"
          codesign --verify --deep --strict "dist/Bloom Dev.app"
          file "dist/Bloom Dev.app/Contents/MacOS/Bloom"
          ditto -c -k --sequesterRsrc --keepParent "dist/Bloom Dev.app" dist/Bloom-PR-178-5fe90787.zip
          shasum -a 256 dist/Bloom-PR-178-5fe90787.zip > dist/SHA256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Bloom-PR-178-5fe90787
          path: |
            dist/Bloom-PR-178-5fe90787.zip
            dist/SHA256.txt
          retention-days: 14
          if-no-files-found: error
