<!doctype html>
<!-- The disk image window, one 660x400 scene, rendered to PNG at 1x and 2x by
     Tools/dmg/build.sh and shown behind Finder's icon view. Everything
     positional in here is calibrated against what Finder actually draws, not
     against what the settings ask for, and each calibrated number carries its
     measurement in the comment beside it. The method, if the icon or the icon
     locations ever change: render the app icon at 512 with NSWorkspace (that
     is the tile as Finder draws it), mount the built image, screenshot the
     window at 2x, and measure pixels; do not reason from the settings alone,
     because two of the numbers below are not what reasoning predicts. -->
<html><head><meta charset="utf-8"><style>
* { box-sizing:border-box; margin:0; }
body { margin:0; }
.canvas { position:relative; width:660px; height:400px; overflow:hidden; background:linear-gradient(180deg,#123B57 0%,#061420 100%); }
.hand { font-family:'Bradley Hand','Marker Felt','Comic Sans MS',cursive; }
#scale { transform-origin: top left; }
</style></head><body><div id="scale"><div class="canvas">
      <svg style="position:absolute;inset:0" width="660" height="400" viewBox="0 0 660 400">
        <defs>
          <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#EFE7CF"/><stop offset="1" stop-color="#D9CBA6"/>
          </linearGradient>
          <!-- The ribbon's colours are sampled from the icon's own artwork at the two
               points where it crosses the tile edge, window x 145.6 and 248.3: mint
               rgb(160,225,213) fading to rgb(133,201,189), so the icon shades its band
               darker toward the right and the background must do the same. The first
               draft ran its gradient the other way, lighter to the right, and the
               right join showed it as a colour step. userSpaceOnUse pins the stops to
               those exact window x positions. -->
          <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="-8" y1="0" x2="476" y2="0">
            <stop offset="0" stop-color="#A6E6DA"/>
            <stop offset="0.317" stop-color="#A0E1D5"/>
            <stop offset="0.53" stop-color="#85C9BD"/>
            <stop offset="0.75" stop-color="#7FC3B6"/>
            <stop offset="1" stop-color="#84C7BA"/>
          </linearGradient>
          <linearGradient id="barRim" gradientUnits="userSpaceOnUse" x1="-8" y1="0" x2="476" y2="0">
            <stop offset="0" stop-color="#CBFFFB"/>
            <stop offset="0.317" stop-color="#C6FFFA"/>
            <stop offset="0.53" stop-color="#B4FBF3"/>
            <stop offset="1" stop-color="#AFF5EE"/>
          </linearGradient>
          <linearGradient id="barDark" gradientUnits="userSpaceOnUse" x1="-8" y1="0" x2="476" y2="0">
            <stop offset="0" stop-color="#20344A"/>
            <stop offset="0.317" stop-color="#1B3041"/>
            <stop offset="0.53" stop-color="#0E2336"/>
            <stop offset="1" stop-color="#0C2133"/>
          </linearGradient>
        </defs>

        <!-- The beach. Shoreline sweeps from the top right down past the folder, foam edge on the waterline. -->
        <path d="M 660 60 C 545 80 470 120 452 190 C 436 252 452 296 420 336 C 400 362 384 380 380 400 L 660 400 Z" fill="url(#sand)"/>
        <path d="M 660 60 C 545 80 470 120 452 190 C 436 252 452 296 420 336 C 400 362 384 380 380 400" fill="none" stroke="#E9F7F4" stroke-width="5" stroke-linecap="round" opacity=".85"/>
        <path d="M 645 84 C 552 104 494 140 478 198 C 466 244 478 288 452 326" fill="none" stroke="#E9F7F4" stroke-width="2" stroke-dasharray="10 14" stroke-linecap="round" opacity=".3"/>

        <!-- Two lanes arrive from the left and vanish under the icon's tile, exactly as the mark's lanes
             are cut at its panel. Their ends sit well inside the tile so a few points of Finder layout
             drift cannot expose a stub. -->
        <path d="M 0 88 C 64 96 118 134 172 176 L 172 194 C 114 152 60 116 0 112 Z" fill="#197593" opacity=".9"/>
        <path d="M 0 306 C 62 300 116 262 172 222 L 172 202 C 116 244 58 276 0 282 Z" fill="#2AA3B4" opacity=".9"/>

        <!-- One continuous current, passing behind the icon through the exact points
             where the real icon's band meets its tile edges: in at (145.6, 187.8) with
             slope 0.079, out at (248.3, 203.95) with slope 0.031. Those are measured,
             not designed. Finder renders the 512 icon with Apple's standard margin, so
             the artwork spans 50..461 of the canvas (bounding box of alpha above 240
             in an NSWorkspace render), and the band's centreline crosses those edges
             at canvas y 244.5 and 311; at 128pt with the icon located at (197, 190)
             the tile's artwork origin lands at window (133, 126.7), the odd 0.7 coming
             off a mounted retina screenshot. The slopes matter as much as the
             positions: matching position alone left a visible kink at both joins.

             The band is drawn the way the icon draws its own, a dark outer edge, then
             a bright inner rim, then the mint body, as three concentric strokes on one
             centreline. The widths come from the same 512 render: mint body with its
             rim is 55px there, 13.75pt here; the rim is the outer 0.5pt of that; the
             dark edge adds about 1pt a side. The original single 19pt stroke was both
             too thick and edgeless, which is what made the icon's band read as a
             separate outlined object sitting on a background stripe.

             The tail runs on past the shoreline on purpose: a second sand pass below
             occludes it, because ending the stroke in open water left a rounded stub
             that read as a cut line. -->
        <g fill="none" stroke-linecap="round">
          <path id="current" d="M -8 185.8 C 48 184.8 110 185.0 145.6 187.8 C 181.2 190.6 214 202.9 248.3 203.95 C 292 205.3 328 214 358 232 C 388 250 420 282 452 322" stroke="url(#barDark)" stroke-width="15.7"/>
          <path d="M -8 185.8 C 48 184.8 110 185.0 145.6 187.8 C 181.2 190.6 214 202.9 248.3 203.95 C 292 205.3 328 214 358 232 C 388 250 420 282 452 322" stroke="url(#barRim)" stroke-width="13.75"/>
          <path d="M -8 185.8 C 48 184.8 110 185.0 145.6 187.8 C 181.2 190.6 214 202.9 248.3 203.95 C 292 205.3 328 214 358 232 C 388 250 420 282 452 322" stroke="url(#bar)" stroke-width="12.75"/>
        </g>
        <!-- The current runs on under the beach: the same sand shape again, on top of
             the band, so the shore occludes the tail. The dashed line is repeated too,
             because this second fill buried the first copy. -->
        <path d="M 660 60 C 545 80 470 120 452 190 C 436 252 452 296 420 336 C 400 362 384 380 380 400 L 660 400 Z" fill="url(#sand)"/>
        <path d="M 660 60 C 545 80 470 120 452 190 C 436 252 452 296 420 336 C 400 362 384 380 380 400" fill="none" stroke="#E9F7F4" stroke-width="5" stroke-linecap="round" opacity=".85"/>
        <path d="M 645 84 C 552 104 494 140 478 198 C 466 244 478 288 452 326" fill="none" stroke="#E9F7F4" stroke-width="2" stroke-dasharray="10 14" stroke-linecap="round" opacity=".3"/>
        <ellipse cx="437" cy="304" rx="20" ry="7" fill="#E9F7F4" opacity=".5"/>

        <!-- One soft shelf of light across the whole width, behind the label row.
             Finder puts the labels where it likes horizontally, and two per label
             plates drifted against the text on every attempt, so the shelf spans
             everything and nothing has to line up. The label text sits at exactly
             y 268.5..279.5 (measured off the mounted window, both labels agreeing to
             the pixel), centre 274; the shelf is centred there, its core clears the
             text by about 5pt each side, and it feathers out over about 12pt so it
             reads as light in the water rather than a bar. Opacity 0.6 is the lowest
             tried that keeps Finder's near black label text comfortable over the deep
             water; over the sand the text hardly needs the help. -->
        <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#E9F7F4" stop-opacity="0"/>
          <stop offset="0.28" stop-color="#E9F7F4" stop-opacity="0.6"/>
          <stop offset="0.72" stop-color="#E9F7F4" stop-opacity="0.6"/>
          <stop offset="1" stop-color="#E9F7F4" stop-opacity="0"/>
        </linearGradient>
        <rect x="0" y="252" width="660" height="44" fill="url(#shelf)"/>

        <!-- The school. -->
        <g id="fish1" fill="#4FD8C4" opacity=".85" transform="translate(84,344)">
          <path d="M 0 0 q 14 -9 30 0 q -16 9 -30 0 Z M 32 0 l 12 -8 v 16 Z"/><circle cx="7" cy="-3" r="1.6" fill="#061420"/>
        </g>
        <g fill="#2AA3B4" opacity=".85" transform="translate(150,372) scale(.8)">
          <path d="M 0 0 q 14 -9 30 0 q -16 9 -30 0 Z M 32 0 l 12 -8 v 16 Z"/><circle cx="7" cy="-3" r="1.6" fill="#061420"/>
        </g>
        <g fill="#9BE9DC" opacity=".8" transform="translate(226,352) scale(.7)">
          <path d="M 0 0 q 14 -9 30 0 q -16 9 -30 0 Z M 32 0 l 12 -8 v 16 Z"/><circle cx="7" cy="-3" r="1.6" fill="#061420"/>
        </g>
        <g fill="#4FD8C4" opacity=".7" transform="translate(196,386) scale(.6) scale(-1,1)">
          <path d="M 0 0 q 14 -9 30 0 q -16 9 -30 0 Z M 32 0 l 12 -8 v 16 Z"/><circle cx="7" cy="-3" r="1.6" fill="#061420"/>
        </g>
        <g fill="#2AA3B4" opacity=".7" transform="translate(268,380) scale(.55)">
          <path d="M 0 0 q 14 -9 30 0 q -16 9 -30 0 Z M 32 0 l 12 -8 v 16 Z"/><circle cx="7" cy="-3" r="1.6" fill="#061420"/>
        </g>
        <g fill="#9BE9DC" opacity=".65" transform="translate(60,384) scale(.5) scale(-1,1)">
          <path d="M 0 0 q 14 -9 30 0 q -16 9 -30 0 Z M 32 0 l 12 -8 v 16 Z"/><circle cx="7" cy="-3" r="1.6" fill="#061420"/>
        </g>
        <g stroke="#9BE9DC" opacity=".5" fill="none" stroke-width="1.5">
          <circle cx="72" cy="330" r="2"/><circle cx="68" cy="322" r="2.6"/><circle cx="246" cy="336" r="2"/>
          <circle cx="290" cy="366" r="2"/><circle cx="294" cy="358" r="1.6"/><circle cx="128" cy="356" r="1.8"/>
        </g>

        <!-- Seaweed in the near corner. -->
        <g fill="none" stroke-linecap="round">
          <path d="M 18 400 C 12 372 26 356 16 330" stroke="#123B57" stroke-width="5"/>
          <path d="M 34 400 C 40 376 28 362 38 338" stroke="#197593" stroke-width="4"/>
          <path d="M 50 400 C 46 380 56 370 50 352" stroke="#2AA3B4" stroke-width="3.5" opacity=".8"/>
        </g>

        <!-- Ashore: shells, a starfish, a crab out for a walk. -->
        <g transform="translate(560,340)" stroke="#B49E6C" fill="#F6F0DD" stroke-width="2" stroke-linejoin="round">
          <path d="M -12 8 A 14 14 0 0 1 12 8 L 0 12 Z"/>
          <path d="M -12 8 L 0 -6 M 12 8 L 0 -6 M -5 10 L 0 -6 M 5 10 L 0 -6" fill="none" stroke-width="1.3"/>
        </g>
        <g transform="translate(614,300) rotate(18)" fill="#F6F0DD" stroke="#B49E6C" stroke-width="2">
          <path d="M 0 0 m -9 0 a 9 9 0 1 1 18 0 a 7 7 0 1 1 -13 2 a 4.5 4.5 0 1 1 8 -1" fill="none" stroke-linecap="round"/>
        </g>
        <g transform="translate(508,352) rotate(-12)" fill="#E8B94A" stroke="#B4832A" stroke-width="1.6" stroke-linejoin="round" opacity=".95">
          <path d="M 0 -11 L 3 -3 L 11 -3 L 5 2 L 7 10 L 0 5 L -7 10 L -5 2 L -11 -3 L -3 -3 Z"/>
        </g>
        <g transform="translate(472,332) rotate(24) scale(.8)" stroke="#B49E6C" fill="#F6F0DD" stroke-width="2" stroke-linejoin="round">
          <path d="M -12 8 A 14 14 0 0 1 12 8 L 0 12 Z"/>
          <path d="M -12 8 L 0 -6 M 12 8 L 0 -6" fill="none" stroke-width="1.3"/>
        </g>
        <g transform="translate(592,378)">
          <g fill="none" stroke="#C86A5A" stroke-width="2.5" stroke-linecap="round">
            <path d="M -10 -6 C -16 -12 -22 -12 -26 -8 M 10 -6 C 16 -12 22 -12 26 -8"/>
            <path d="M -8 6 l -6 6 M -3 8 l -3 7 M 8 6 l 6 6 M 3 8 l 3 7"/>
          </g>
          <ellipse cx="0" cy="0" rx="13" ry="9" fill="#E4695E"/>
          <circle cx="-5" cy="-8" r="3" fill="#E4695E"/><circle cx="5" cy="-8" r="3" fill="#E4695E"/>
          <circle cx="-5" cy="-8" r="1.2" fill="#061420"/><circle cx="5" cy="-8" r="1.2" fill="#061420"/>
        </g>

        <!-- The handwritten arrow: a loose curve riding above the current, from the icon toward the folder. -->
        <path d="M 262 152 C 300 132 330 136 352 152 C 364 161 374 170 384 180" fill="none" stroke="#E9F7F4" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.1 9" opacity=".95"/>
        <path d="M 378 166 L 388 181 L 370 183" fill="none" stroke="#E9F7F4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <!-- The words, hand written, with room to breathe on both sides. -->
      <div class="hand" style="position:absolute;left:230px;width:220px;top:92px;text-align:center;font-size:21px;color:#E9F7F4;text-shadow:0 1px 4px rgba(0,0,0,.55);transform:rotate(-2deg)">along the current</div>
</div>
</div></body></html>
